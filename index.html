<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stardew Valley — Calculadora de Granja</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323:wght@400&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0a0000;
  --red: #e74c3c;
  --red-dark: #c0392b;
  --red-glow: rgba(231,76,60,0.3);
  --text: #ecf0f1;
  --text-dim: #95a5a6;
  --surface: #1c1f26;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'VT323', monospace;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}

/* Fondo con patrón de tiles */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 31px, rgba(231,76,60,0.03) 31px, rgba(231,76,60,0.03) 32px),
    repeating-linear-gradient(90deg, transparent, transparent 31px, rgba(231,76,60,0.03) 31px, rgba(231,76,60,0.03) 32px);
  pointer-events: none;
}

/* Viñeta */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.85) 100%);
  pointer-events: none;
}

.card {
  position: relative;
  z-index: 1;
  text-align: center;
  padding: 60px 48px;
  max-width: 640px;
  width: 90%;
  background: var(--surface);
  border: 1px solid #2a0000;
  border-top: 3px solid var(--red);
  animation: fadeUp 0.6s ease both;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* Píxeles decorativos en las esquinas */
.card::before, .card::after {
  content: '';
  position: absolute;
  width: 12px;
  height: 12px;
  background: var(--red);
}
.card::before { top: -1px; left: -1px; }
.card::after  { bottom: -1px; right: -1px; }

.corner-br::before, .corner-br::after {
  content: '';
  position: absolute;
  width: 12px;
  height: 12px;
  background: var(--red);
}
.corner-br::before { top: -1px; right: -1px; }
.corner-br::after  { bottom: -1px; left: -1px; }

.icon {
  font-size: 48px;
  display: block;
  margin-bottom: 24px;
  animation: bob 2.5s ease-in-out infinite;
}
@keyframes bob {
  0%, 100% { transform: translateY(0); }
  50%       { transform: translateY(-6px); }
}

.title {
  font-family: 'Press Start 2P', monospace;
  font-size: 14px;
  color: var(--red);
  line-height: 1.8;
  margin-bottom: 8px;
  text-shadow: 0 0 20px var(--red-glow);
  letter-spacing: 1px;
}

.subtitle {
  font-size: 20px;
  color: var(--text-dim);
  margin-bottom: 40px;
  letter-spacing: 2px;
}

.divider {
  height: 1px;
  background: repeating-linear-gradient(90deg, var(--red-dark) 0px, var(--red-dark) 6px, transparent 6px, transparent 12px);
  margin-bottom: 40px;
  opacity: 0.5;
}

.features {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 40px;
  text-align: left;
}

.feature {
  font-size: 16px;
  color: var(--text-dim);
  padding: 6px 10px;
  border-left: 2px solid #2a0000;
}

.feature span {
  color: var(--red);
  margin-right: 6px;
}

.btn-launch {
  display: inline-block;
  background: var(--red-dark);
  color: white;
  font-family: 'Press Start 2P', monospace;
  font-size: 10px;
  padding: 16px 32px;
  text-decoration: none;
  letter-spacing: 2px;
  border: 1px solid var(--red);
  cursor: pointer;
  transition: background 0.15s, box-shadow 0.15s, transform 0.1s;
  position: relative;
  overflow: hidden;
}

.btn-launch::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, transparent 50%);
}

.btn-launch:hover {
  background: var(--red);
  box-shadow: 0 0 24px var(--red-glow);
}

.btn-launch:active {
  transform: translateY(2px);
}

.footer {
  margin-top: 32px;
  font-size: 14px;
  color: #3a3a3a;
  letter-spacing: 1px;
}

/* Estrellas de fondo */
.stars {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
}

.star {
  position: absolute;
  width: 2px;
  height: 2px;
  background: rgba(231,76,60,0.4);
  animation: twinkle var(--d, 3s) ease-in-out infinite var(--delay, 0s);
}

@keyframes twinkle {
  0%, 100% { opacity: 0; }
  50%       { opacity: 1; }
}
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="card corner-br">
  <span class="icon">🌾</span>

  <div class="title">CALCULADORA<br>DE GRANJA</div>
  <div class="subtitle">STARDEW VALLEY</div>

  <div class="divider"></div>

  <div class="features">
    <div class="feature"><span>🌱</span>38 Cultivos</div>
    <div class="feature"><span>🐄</span>Animales</div>
    <div class="feature"><span>🍷</span>Procesamiento</div>
    <div class="feature"><span>🌳</span>Árboles frutales</div>
    <div class="feature"><span>🎣</span>Pesca</div>
    <div class="feature"><span>🌿</span>Recolección</div>
    <div class="feature"><span>🌲</span>Resineras</div>
    <div class="feature"><span>🏡</span>Invernadero</div>
  </div>

  <a class="btn-launch" href="stardew_index.html" target="_blank">
    ▶ ABRIR CALCULADORA ◀
  </a>

  <div class="footer">Datos basados en Stardew Valley v1.6</div>
</div>

<script>
// Generar estrellas aleatorias
const container = document.getElementById('stars');
for (let i = 0; i < 60; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  s.style.left = Math.random() * 100 + '%';
  s.style.top  = Math.random() * 100 + '%';
  s.style.setProperty('--d', (2 + Math.random() * 4).toFixed(1) + 's');
  s.style.setProperty('--delay', (Math.random() * 4).toFixed(1) + 's');
  container.appendChild(s);
}
</script>
</body>
</html>
